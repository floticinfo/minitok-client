project:
  name: example-project
  stack: node

default_provider: anthropic
providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-20250514

roles:
  intel: { provider: anthropic }
  plan: { provider: anthropic }
  work: { provider: anthropic }
  review: { provider: anthropic }

execution:
  max_retries: 3
  timeout_sec: 600

commit:
  enabled: false
  auto_message: true
