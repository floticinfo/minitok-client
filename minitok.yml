# minitok configuration
# See docs/ARCHITECTURE.md for full schema reference.

project:
  name: "minitok-npm"
  stack: node

providers:
  camel-stream:
    base_url: https://stream.camelai.com
    auth:
      type: api_key
      key: "${CAMEL_STREAM_API_KEY}"
    models:
      - id: auto

roles:
  plan:
    adapter: camel-stream
    model: auto
    effort: medium
  review:
    adapter: camel-stream
    model: auto
    effort: medium
  work:
    adapter: camel-stream
    model: auto
    effort: medium
  intel:
    adapter: camel-stream
    model: auto
    effort: medium

budget:
  token_budget: 500000
  max_cycles: 3

execution:
  max_retries: 3
  timeout_sec: 600
  research_enabled: true

commit:
  enabled: false
  auto_message: true
